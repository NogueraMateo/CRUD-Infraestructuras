services:
  database:
    image: postgres:16-alpine
    restart: unless-stopped

    env_file:
      - .env
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    
    networks:
      - app_network

  api:
    image: npmateou/apitodeploy:latest
    restart: unless-stopped

    env_file:
      - .env
    
    ports:
      - "8000:8000"
    
    depends_on:
      database:
        condition: service_healthy
    
    networks:
      - app_network
    
volumes:
  postgres_data:

networks:
  app_network:
    driver: bridge
