
services:

  database:
    container_name: crud_database
    image: postgres:16
    env_file:
      - ./src/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    
  api:
    container_name: crud_api
    build: .
    env_file:
      - ./src/.env
    ports:
      - "8000:8000"
    depends_on:
      database:
        condition: service_healthy
  
volumes:
  postgres_data: