apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret 
  namespace: minikube-app
type: Opaque
stringData:
  POSTGRES_USER: parcial2
  POSTGRES_PASSWORD: parcial2
---
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: postgres
  namespace: minikube-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres 
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: parcial2-db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          args: ["-p", "5432"]
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: 
  name: postgres-service
  namespace: minikube-app
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP